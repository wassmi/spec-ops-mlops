apiVersion: apps/v1
kind: Deployment
metadata:
  name: spec-ops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spec-ops
  template:
    metadata:
      labels:
        app: spec-ops
    spec:
      initContainers:
      - name: model-downloader
        image: alpine/git
        env:
        -name: MODEL_REPO
        value: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
        command: ["sh", "-c", "git clone https://huggingface.co/$MODEL_REPO /data/model"]
        volumeMounts:
        - name: model-storage
          mountPath: /data
      containers:
      - name: engine
        image: ghcr.io/wassmi/spec-ops-serving:latest
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 10
        env:
        - name: OMP_NUM_THREADS
          value: "1"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: model-storage
        emptyDir: {}